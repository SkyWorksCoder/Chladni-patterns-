<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chladni Patterns 3D</title>
  
  <style>
    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      overflow: hidden;
      background: #000;
    }
    canvas {
      display: block;
      width: 100vw;
      height: 100vh;
    }
    #loading {
      color: black;
      /* visibility: hidden; */
    }
    #panel {
      position: fixed;
      bottom: 50px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;
      display: flex;
      flex-direction: column;
      gap: 8px;
      pointer-events: none;
    }
    #ig-link {
      pointer-events: all;
      display: flex;
      align-items: center;
      gap: 7px;
      background: rgba(255, 255, 255, 0.2);
      border: 1px solid rgba(255, 255, 255, 0.09);
      border-radius: 10px;
      padding: 8px 13px;
      backdrop-filter: blur(8px);
      text-decoration: none;
      width: fit-content;
      transition: border-color 0.25s, background 0.25s;
      z-index: 9999;
    }
    #ig-link:hover {
      border-color: rgba(220, 80, 120, 0.55);
      background: rgba(30, 0, 15, 0.65);
    }
    #ig-link svg {
      width: 14px;
      height: 14px;
      flex-shrink: 0;
    }
    #ig-link span {
      font-family: 'Courier New', monospace;
      font-size: 11px;
      letter-spacing: 0.07em;
      color: rgba(255, 255, 255, 0.7);
      transition: color 0.25s;
    }
    #ig-link:hover span {
      color: #ff6688;
    }
  </style>

  <!-- External libraries -->
  <script src="https://cdn.jsdelivr.net/npm/dat.gui/build/dat.gui.min.js"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>

  <!-- Import Map for Three.js -->
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <div id="panel">
    <a id="ig-link" href="https://instagram.com/null_sky.dev" target="_blank">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="white">
        <path d="M7 2C4.2 2 2 4.2 2 7v10c0 2.8 
                 2.2 5 5 5h10c2.8 0 5-2.2 
                 5-5V7c0-2.8-2.2-5-5-5H7zm5 
                 5a5 5 0 110 10 5 5 0 010-10zm6.5-1.5a1.5 
                 1.5 0 11-3 0 1.5 1.5 0 013 0z"/>
      </svg>
      <span>@null_sky.dev</span>
    </a>
  </div>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
    import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
    import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';

    // --- Audio Synthesis Setup ---
    let audioCtx = null;
    let oscillator = null;
    let gainNode = null;
    let isAudioStarted = false;

    function initAudio() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        oscillator = audioCtx.createOscillator();
        gainNode = audioCtx.createGain();

        oscillator.type = 'sine';
        gainNode.gain.value = 0.5;

        oscillator.connect(gainNode);
        gainNode.connect(audioCtx.destination);
      }
    }

    function playAudio(m, n) {
      initAudio();
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }

      if (!isAudioStarted) {
        oscillator.start();
        isAudioStarted = true;
      }

      const targetFreq = 120 * Math.sqrt(m * m + n * n);
      oscillator.frequency.setTargetAtTime(targetFreq, audioCtx.currentTime, 0.05);
    }

    // --- Chladni Mathematics ---
    function Amp(x, y, m, n) {
      return Math.cos(m * Math.PI * x) * Math.cos(n * Math.PI * y) - 
             Math.cos(n * Math.PI * x) * Math.cos(m * Math.PI * y);
    }

    // --- Three.js Scene Setup ---
    let cw = window.innerWidth;
    let ch = window.innerHeight;

    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(75, cw / ch, 0.1, 1000);
    camera.position.set(0, 2, 3);
    scene.rotation.x = -Math.PI / 2;

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(cw, ch);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    document.body.appendChild(renderer.domElement);

    const orbitcontrols = new OrbitControls(camera, renderer.domElement);
    orbitcontrols.enableDamping = true;
    orbitcontrols.dampingFactor = 0.05;

    // --- Particles & Geometry ---
    const particleCount = 2000;
    const positions = [];
    for (let i = 0; i < particleCount; i++) {
      positions.push((Math.random() - 0.5) * 2, (Math.random() - 0.5) * 2, 0.01);
    }

    const geometry = new THREE.BufferGeometry();
    const amplitudes = new Float32Array(particleCount);
    geometry.setAttribute("position", new THREE.Float32BufferAttribute(positions, 3));
    geometry.setAttribute("amplitude", new THREE.BufferAttribute(amplitudes, 1));

    const material = new THREE.ShaderMaterial({
      transparent: true,
      depthWrite: false,
      blending: THREE.AdditiveBlending,
      uniforms: {
        colorNode: { value: new THREE.Color(0xffd700) },
        colorVibe: { value: new THREE.Color(0x00f3ff) }
      },
      vertexShader: `
        attribute float amplitude;
        varying float vAmp;

        void main() {
          vAmp = amplitude;
          gl_PointSize = mix(2.5, 5.0, amplitude); 
          gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
        }
      `,
      fragmentShader: `
        uniform vec3 colorNode;
        uniform vec3 colorVibe;
        varying float vAmp;

        void main() {
          vec2 c = gl_PointCoord - vec2(0.5);
          float d = length(c);
          float alpha = exp(-10.0 * d * d);
          vec3 finalColor = mix(colorNode, colorVibe, clamp(vAmp, 0.0, 1.0));
          gl_FragColor = vec4(finalColor, alpha);
        }
      `
    });

    const points = new THREE.Points(geometry, material);
    scene.add(points);

    // --- Base Plate ---
    const plateGeo = new THREE.PlaneGeometry(2, 2);
    const plateMat = new THREE.MeshStandardMaterial({
      color: 0x0a0a0f,
      roughness: 0.85,
      metalness: 0.1,
      side: THREE.DoubleSide
    });
    const plate = new THREE.Mesh(plateGeo, plateMat);
    plate.position.z = -0.01;
    scene.add(plate);

    // --- Lighting ---
    const ambientLight = new THREE.AmbientLight(0xffffff, 0.4);
    scene.add(ambientLight);

    const dirLight = new THREE.DirectionalLight(0xffffff, 1.2);
    dirLight.position.set(5, 5, 5);
    scene.add(dirLight);

    const pointLight = new THREE.PointLight(0xff4444, 3, 10);
    pointLight.position.set(0, 0, 1);
    scene.add(pointLight);

    // --- Postprocessing (Bloom) ---
    const composer = new EffectComposer(renderer);
    composer.addPass(new RenderPass(scene, camera));

    const bloomPass = new UnrealBloomPass(
      new THREE.Vector2(window.innerWidth, window.innerHeight),
      1.2,
      0.4,
      0.25
    );
    composer.addPass(bloomPass);

    // --- Controls & GUI ---
    const controls = {
      v1: 6,
      v2: 2
    };

    function resetParticles() {
      const posArray = geometry.attributes.position.array;
      for (let i = 0; i < posArray.length; i += 3) {
        posArray[i]     = (Math.random() - 0.5) * 2;
        posArray[i + 1] = (Math.random() - 0.5) * 2;
        posArray[i + 2] = 0.01;
      }
      geometry.attributes.position.needsUpdate = true;
    }

    const gui = new dat.GUI();
    gui.add(controls, "v1", 1, 8, 1).name("m").onChange(() => {
      playAudio(controls.v1, controls.v2);
      resetParticles();
    });
    gui.add(controls, "v2", 1, 8, 1).name("n").onChange(() => {
      playAudio(controls.v1, controls.v2);
      resetParticles();
    });

    // --- Animation Loop ---
    const h = 0.001;
    function animate() {
      requestAnimationFrame(animate);
      orbitcontrols.update();

      const posArray = geometry.attributes.position.array;
      const ampArray = geometry.attributes.amplitude.array;
      const m = controls.v1;
      const n = controls.v2;

      for (let i = 0; i < posArray.length; i += 3) {
        let px = posArray[i];
        let py = posArray[i + 1];

        let absA = Math.abs(Amp(px, py, m, n));

        let gradX = (Math.abs(Amp(px + h, py, m, n)) - Math.abs(Amp(px - h, py, m, n))) / (2 * h);
        let gradY = (Math.abs(Amp(px, py + h, m, n)) - Math.abs(Amp(px, py - h, m, n))) / (2 * h);

        const driftX = -gradX * absA * 0.0005;
        const driftY = -gradY * absA * 0.0005;
        const jitterX = (Math.random() - 0.5) * absA * 0.02;
        const jitterY = (Math.random() - 0.5) * absA * 0.02;

        ampArray[i / 3] = absA;
        posArray[i]     = px + driftX + jitterX;
        posArray[i + 1] = py + driftY + jitterY;
      }

      geometry.attributes.position.needsUpdate = true;
      geometry.attributes.amplitude.needsUpdate = true;

      composer.render();
    }

    animate();

    // Start audio on first user interaction to comply with browser policies
    window.addEventListener('pointerdown', () => {
      playAudio(controls.v1, controls.v2);
    }, { once: true });

    // Handle Window Resize
    window.addEventListener('resize', () => {
      cw = window.innerWidth;
      ch = window.innerHeight;
      camera.aspect = cw / ch;
      camera.updateProjectionMatrix();
      renderer.setSize(cw, ch);
      composer.setSize(cw, ch);
    });
  </script>
</body>
</html>
