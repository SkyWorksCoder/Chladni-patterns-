  <script type="module">
  
const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
const oscillator = audioCtx.createOscillator();
const gainNode = audioCtx.createGain();

oscillator.type = 'sine';
gainNode.gain.value = 0.7; // Volume at 70%

oscillator.connect(gainNode);
gainNode.connect(audioCtx.destination);

let isAudioStarted = false;


function playAudio(m, n) {

  if (audioCtx.state === 'suspended') {
    audioCtx.resume();
  }

  if (!isAudioStarted) {
    oscillator.start();
    isAudioStarted = true;
  }

  // Calculate target frequency from m and n
  const targetFreq = 120 * Math.sqrt(m * m + n * n);

 oscillator.frequency.setTargetAtTime(targetFreq, audioCtx.currentTime, 0.05);
}
function resetParticles() {
  const posArray = geometry.attributes.position.array;
  for (let i = 0; i < posArray.length; i += 3) {
    posArray[i]     = (Math.random() - 0.5) * 2; // x
    posArray[i + 1] = (Math.random() - 0.5) * 2; // y
    posArray[i + 2] = 0.01;                     // z
  }
  geometry.attributes.position.needsUpdate = true;
}

let controls={
v1:6,
v2:2
}
function Amp(x,y,m,n){
return Math.cos(m*Math.PI*x)*Math.cos(n*Math.PI*y)-Math.cos(n*Math.PI*x)*Math.cos(m*Math.PI*y)
}



function map(value, start1, stop1, start2, stop2, withinBounds = false) {
  let newValue = ((value - start1) / (stop1 - start1)) * (stop2 - start2) + start2;
  if (!withinBounds) return newValue;
  if (start2 < stop2) {
    return Math.min(Math.max(newValue, start2), stop2);
  } else {
    return Math.min(Math.max(newValue, stop2), start2);
  }
}


let gui=new dat.GUI
gui.add(controls,"v1",1,8,1).name("m").onChange(()=>{
playAudio(controls.v1,controls.v2)
resetParticles()
})
gui.add(controls,"v2",1,8,1).name("n").onChange(()=>{
playAudio(controls.v1,controls.v2)
resetParticles()
})






function random(min=0, max) {
  return Math.random() * (max - min) + min;
}

    import * as THREE from 'three';
    import { GLTFLoader } from 'three/examples/jsm/loaders/GLTFLoader.js';
    import { OrbitControls } from 'three/examples/jsm/controls/OrbitControls.js';
//import { AnimationMixer } from '';
import { FontLoader } from 'three/examples/jsm/loaders/FontLoader.js';
      import { TextGeometry } from 'three/examples/jsm/geometries/TextGeometry.js';
import { AnimationMixer } from 'three';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
let cw=window.innerWidth

let ch=window.innerHeight

const scene=new THREE.Scene();

const camera=new THREE.PerspectiveCamera(75,cw/ch,0.1,10000);
camera.position.set(0, 2,3);
//camera.position.set(8,5,8);
scene.rotation.x = -Math.PI / 2; 

const renderer=new THREE.WebGLRenderer();
document.body.appendChild(renderer.domElement)

renderer.setSize(cw,ch)

renderer.setPixelRatio(devicePixelRatio)

renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
//renderer.toneMapping = THREE.NoToneMapping;
// or try:
//renderer.toneMapping = THREE.ACESFilmicToneMapping;
//renderer.toneMappingExposure = 1.5;
const orbitcontrols=new OrbitControls(camera,renderer.domElement)

orbitcontrols.enableDamping=true


orbitcontrols.dampingFactor=0.01



var m=controls.v1
var n=controls.v2
var positions=[]
var sc=1
var colors=[1,0,0]
for(let i=0;i<2000;i++){
let x = (Math.random() - 0.5) * 2;
  let y = (Math.random() - 0.5) * 2;
  let z = 0.01
positions.push(x,y,z)

}





const geometry = new THREE.BufferGeometry();
const amplitudes = new Float32Array(2000); 
geometry.setAttribute("position", new THREE.Float32BufferAttribute(positions, 3));

geometry.setAttribute("amplitude", new THREE.BufferAttribute(amplitudes, 1));
// Add a uniform for amplitude/vibration intensity or compute it per vertex
const material = new THREE.ShaderMaterial({
  transparent: true,
  depthWrite: false,
  blending: THREE.AdditiveBlending,
  uniforms: {
    colorNode: { value: new THREE.Color(0xffd700) }, // Gold/White at nodal line
    colorVibe: { value: new THREE.Color(0x00f3ff) }  // Neon Cyan at high vibration
  },
  vertexShader: `
    attribute float amplitude; // Passes |A| from JS
    varying float vAmp;

    void main() {
      vAmp = amplitude;
      
      // Make particles slightly smaller at nodal lines for crispness
      gl_PointSize = mix(2.5, 5.0, amplitude); 
      gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
    }
  `,
  fragmentShader: `
    uniform vec3 colorNode;
    uniform vec3 colorVibe;
    varying float vAmp;

    void main() {
      vec2 c = gl_PointCoord - vec2(0.5);
      float d = length(c);
      float alpha = exp(-10.0 * d * d);

      // Interpolate smoothly between Neon Cyan (high vibe) and Gold (nodal line)
      vec3 finalColor = mix(colorNode, colorVibe, clamp(vAmp, 0.0, 1.0));

      gl_FragColor = vec4(finalColor, alpha);
    }
  `
});

//material.toneMapped = false;
const points = new THREE.Points(geometry, material)
geometry.attributes.position.needsUpdate = true;
//points.scale.set(10,10,10);
scene.add(points);

// A sleek, semi-transparent metallic/glass plate under the sand
const plateGeo = new THREE.PlaneGeometry(2, 2);
const plateMat = new THREE.MeshStandardMaterial({
  color: 0x0a0a0f,  // Dark slate/black
  roughness: 0.85,  // Matte finish (eliminates shiny mirror reflection)
  metalness: 0.1,   // Low metallic glare
  side: THREE.DoubleSide
});

const plate = new THREE.Mesh(plateGeo, plateMat);
plate.position.z = -0.01; // Just behind particles
scene.add(plate);



 // Soft fill light
const ambientLight = new THREE.AmbientLight(0xffffff, 0.4);
scene.add(ambientLight);

// Angled directional light to accentuate depth without a center hotspot
const dirLight = new THREE.DirectionalLight(0xffffff, 1.2);
dirLight.position.set(5, 5, 5); 
scene.add(dirLight);

  

  const pointLight = new THREE.PointLight(0xff4444, 3, 10);
  pointLight.position.set(0, 0, 1);
  scene.add(pointLight);
//scene.add(hemiLight);
// For Directional Light:
dirLight.castShadow = true;
dirLight.shadow.mapSize.width = 1024;
dirLight.shadow.mapSize.height = 1024;

// For Point Light:
pointLight.castShadow = true;

// For Plate Mesh:
plate.receiveShadow = true;

// For Particle System:
points.castShadow = true;

const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));

const bloomPass = new UnrealBloomPass(
    new THREE.Vector2(window.innerWidth, window.innerHeight),
   1.2, // strength
    .4, // radius
    0.25// threshold
);
composer.addPass(bloomPass);

//scene.add(new THREE.GridHelper(100,200,20))
//scene.add(new THREE.AxesHelper(100,100,100))

//orbitcontrols.enabled=false
const clock = new THREE.Clock();

var h=0.001
function animate() {
  requestAnimationFrame(animate)
  orbitcontrols.update()
//  scene.rotation.y+=0.005
const posArray = geometry.attributes.position.array;
const ampArray= geometry.attributes.amplitude.array
// in animate():
for (let i = 0; i < posArray.length; i += 3) {
  let px = posArray[i];
  let py = posArray[i + 1];
//absA is zero when its in nodal line so no vibration  
  let absA=Math.abs(Amp(px,py,m,n))
//  let pz = posArray[i + 2];

//below this are partial derivatives finite differences :]
let gradX=(Math.abs(Amp(px+h,py,m,n))-Math.abs(Amp(px-h,py,m,n)))/(2*h)

let gradY=(Math.abs(Amp(px,py+h,m,n))-Math.abs(Amp(px,py-h,m,n)))/(2*h)

const driftX = -gradX * absA * 0.0005; 
const driftY = -gradY * absA * 0.0005;

const jitterX = (Math.random() - 0.5) * absA * 0.02;
const jitterY = (Math.random() - 0.5) * absA * 0.02;

let pIdx = i / 3;
  ampArray[pIdx] = absA; 
const newX = px + driftX + jitterX;
const newY = py + driftY + jitterY;
 posArray[i]     = newX
 posArray[i + 1] = newY
//  posArray[i + 2] = pz + dz * dt;
}

  geometry.attributes.position.needsUpdate = true;  
  geometry.attributes.amplitude.needsUpdate = true;  
//geometry.setDrawRange(0, positions.length / 3);

 //  bloomPass.strength=controls.val
//renderer.render(scene, camera);
  composer.render()
 m=controls.v1
 n=controls.v2 
}

animate();
playAudio(m,n)
</script>
